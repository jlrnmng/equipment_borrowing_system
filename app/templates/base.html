<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QR Equipment Borrowing System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='ui-polish.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <div id="appToastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.showAppToast = function (message, variant, delay) {
            var container = document.getElementById('appToastContainer');
            if (!container) {
                return;
            }

            var kind = variant || 'info';
            var autoHideDelay = Number(delay || 4500);
            var iconMap = {
                success: 'bi-check-circle-fill',
                danger: 'bi-x-circle-fill',
                warning: 'bi-exclamation-triangle-fill',
                info: 'bi-info-circle-fill'
            };
            var icon = iconMap[kind] || iconMap.info;

            var toastEl = document.createElement('div');
            toastEl.className = 'toast align-items-center border-0 app-toast app-toast-' + kind;
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');
            toastEl.innerHTML =
                '<div class="d-flex">' +
                '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i><span></span></div>' +
                '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>' +
                '</div>';

            toastEl.querySelector('.toast-body span').textContent = String(message || 'Done');
            container.appendChild(toastEl);

            var toast = new bootstrap.Toast(toastEl, { delay: autoHideDelay });
            toastEl.addEventListener('hidden.bs.toast', function () {
                toastEl.remove();
            });
            toast.show();
        };

        window.showInlinePopup = function (options) {
            options = options || {};
            var message = String(options.message || 'Done');
            var variant = String(options.variant || 'info');
            var delay = Number(options.delay || 2000);
            var anchorSelector = options.anchorSelector || null;
            var containerSelector = options.containerSelector || null;

            var container = containerSelector
                ? document.querySelector(containerSelector)
                : null;
            if (!container) {
                container = document.querySelector('.page-content') || document.body;
            }

            var alertEl = document.createElement('div');
            alertEl.className = 'alert alert-' + variant + ' alert-dismissible fade show mb-3';
            alertEl.setAttribute('role', 'alert');
            alertEl.innerHTML =
                '<i class="bi bi-info-circle me-2"></i>' +
                message +
                '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';

            var anchorEl = anchorSelector ? document.querySelector(anchorSelector) : null;
            if (anchorEl && anchorEl.parentNode === container) {
                container.insertBefore(alertEl, anchorEl);
            } else if (anchorEl && anchorEl.parentNode) {
                anchorEl.parentNode.insertBefore(alertEl, anchorEl);
            } else {
                container.prepend(alertEl);
            }

            window.setTimeout(function () {
                alertEl.classList.remove('show');
                alertEl.classList.add('hide');
                window.setTimeout(function () {
                    if (alertEl.parentNode) {
                        alertEl.remove();
                    }
                }, 200);
            }, delay);
        };

        // Force a network re-check when returning via back/forward navigation.
        // This prevents stale pages from being restored from browser history cache.
        window.addEventListener('pageshow', function (event) {
            var nav = window.performance && window.performance.getEntriesByType
                ? window.performance.getEntriesByType('navigation')
                : [];
            var isHistoryNavigation = nav.length > 0 && nav[0].type === 'back_forward';

            if (event.persisted || isHistoryNavigation) {
                window.location.reload();
            }
        });
    </script>
    {% if current_user.is_authenticated %}
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <script>
        (function () {
            var endpoint = {{ (request.endpoint or '') | tojson }};
            var role = {{ (current_user.role or '') | tojson }};
            var userId = {{ current_user.id | tojson }};
            var updateInProgress = false;

            var refreshableEndpoints = {
                'dashboard.index': true,
                'borrow.new_borrow': true,
                'borrow.new_return': true,
                'borrow.overdue_management': true,
                'borrow.notification_center': true,
                'equipment.list_equipment': true,
                'auth.member_dashboard': true
            };

            var autoRefreshEndpoints = {
                'dashboard.index': true,
                'borrow.overdue_management': true,
                'borrow.notification_center': true,
                'equipment.list_equipment': true
            };

            if (!refreshableEndpoints[endpoint]) {
                return;
            }

            function executeScriptsWithin(container) {
                var scripts = container.querySelectorAll('script');
                scripts.forEach(function (oldScript) {
                    var newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(function (attr) {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }

            async function refreshPageContentInPlace() {
                if (updateInProgress) {
                    return false;
                }

                var currentPageContent = document.querySelector('.page-content');
                if (!currentPageContent) {
                    return false;
                }

                updateInProgress = true;
                try {
                    var response = await fetch(window.location.href, {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        credentials: 'same-origin',
                        cache: 'no-store'
                    });

                    if (!response.ok) {
                        return false;
                    }

                    var html = await response.text();
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(html, 'text/html');
                    var nextPageContent = doc.querySelector('.page-content');
                    if (!nextPageContent) {
                        return false;
                    }

                    var bellBtn = document.querySelector('.topbar-right a[title="Notifications"]');
                    var nextBellBtn = doc.querySelector('.topbar-right a[title="Notifications"]');
                    if (bellBtn && nextBellBtn) {
                        bellBtn.outerHTML = nextBellBtn.outerHTML;
                    }

                    var scrollX = window.scrollX;
                    var scrollY = window.scrollY;
                    currentPageContent.innerHTML = nextPageContent.innerHTML;
                    executeScriptsWithin(currentPageContent);
                    window.scrollTo(scrollX, scrollY);
                    return true;
                } catch (err) {
                    return false;
                } finally {
                    updateInProgress = false;
                }
            }

            var socket = io({
                transports: ['websocket', 'polling']
            });

            socket.on('connect_error', function () {
                // Keep app usable even when realtime transport is unavailable.
            });

            socket.on('app_data_changed', function (payload) {
                payload = payload || {};
                if (updateInProgress) {
                    return;
                }

                if (role === 'member') {
                    var targetMemberId = payload.member_id;
                    if (targetMemberId !== null && targetMemberId !== undefined && Number(targetMemberId) !== Number(userId)) {
                        return;
                    }
                }

                window.dispatchEvent(new CustomEvent('app:data-changed', {
                    detail: payload
                }));

                if (!autoRefreshEndpoints[endpoint]) {
                    window.showAppToast('New updates are available.', 'info', 2000);
                    return;
                }

                refreshPageContentInPlace().then(function (updated) {
                    if (updated) {
                        window.showAppToast('Page updated with latest changes.', 'success', 1600);
                        return;
                    }
                    window.showAppToast('New updates are available.', 'info', 2000);
                });
            });
        })();
    </script>
    <script>
        (function () {
            var modalEl = document.getElementById('logoutConfirmModal');
            var confirmBtn = document.getElementById('confirmLogoutBtn');
            if (!modalEl || !confirmBtn || !window.bootstrap) {
                return;
            }

            var logoutUrl = null;
            var modal = new bootstrap.Modal(modalEl);

            document.addEventListener('click', function (event) {
                var trigger = event.target.closest('.js-logout-trigger');
                if (!trigger) {
                    return;
                }

                event.preventDefault();
                logoutUrl = trigger.getAttribute('data-logout-url') || trigger.getAttribute('href');
                modal.show();
            });

            confirmBtn.addEventListener('click', function () {
                if (logoutUrl) {
                    window.location.href = logoutUrl;
                }
            });
        })();
    </script>
    <script>
        (function () {
            var sidebar = document.getElementById('appSidebar');
            var backdrop = document.getElementById('sidebarBackdrop');

            function setSidebarOpen(open) {
                if (!sidebar || !backdrop) {
                    return;
                }
                sidebar.classList.toggle('open', open);
                backdrop.classList.toggle('show', open);
                document.body.classList.toggle('sidebar-open', open);
            }

            window.toggleSidebar = function () {
                if (!sidebar) {
                    return;
                }
                var isOpen = sidebar.classList.contains('open');
                setSidebarOpen(!isOpen);
            };

            window.closeSidebar = function () {
                setSidebarOpen(false);
            };

            if (sidebar) {
                sidebar.querySelectorAll('a.nav-link').forEach(function (link) {
                    link.addEventListener('click', function () {
                        if (window.innerWidth < 992) {
                            setSidebarOpen(false);
                        }
                    });
                });
            }

            function refreshCompactTopbarButtons() {
                var isCompact = window.innerWidth <= 575;
                var buttons = document.querySelectorAll('.topbar-right .btn');

                buttons.forEach(function (btn) {
                    var rawLabel = (btn.getAttribute('data-compact-label') || btn.textContent || '').replace(/\s+/g, ' ').trim();
                    if (!rawLabel) {
                        rawLabel = 'Action';
                    }
                    btn.setAttribute('data-compact-label', rawLabel);

                    if (isCompact) {
                        btn.setAttribute('aria-label', rawLabel);
                        btn.setAttribute('title', rawLabel);
                        if (window.bootstrap && !btn._compactTooltip) {
                            btn.setAttribute('data-bs-toggle', 'tooltip');
                            btn.setAttribute('data-bs-placement', 'bottom');
                            btn._compactTooltip = new bootstrap.Tooltip(btn);
                        }
                    } else {
                        if (btn._compactTooltip) {
                            btn._compactTooltip.dispose();
                            btn._compactTooltip = null;
                        }
                        btn.removeAttribute('data-bs-toggle');
                        btn.removeAttribute('data-bs-placement');
                        btn.removeAttribute('title');
                    }
                });
            }

            refreshCompactTopbarButtons();

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    setSidebarOpen(false);
                }
                refreshCompactTopbarButtons();
            });
        })();
    </script>
    {% endif %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
