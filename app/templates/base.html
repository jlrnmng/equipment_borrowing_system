<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QR Equipment Borrowing System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='ui-polish.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <div id="appToastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.showAppToast = function (message, variant, delay) {
            var container = document.getElementById('appToastContainer');
            if (!container) {
                return;
            }

            var kind = variant || 'info';
            var autoHideDelay = Number(delay || 4500);
            var iconMap = {
                success: 'bi-check-circle-fill',
                danger: 'bi-x-circle-fill',
                warning: 'bi-exclamation-triangle-fill',
                info: 'bi-info-circle-fill'
            };
            var icon = iconMap[kind] || iconMap.info;

            var toastEl = document.createElement('div');
            toastEl.className = 'toast align-items-center border-0 app-toast app-toast-' + kind;
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');
            toastEl.innerHTML =
                '<div class="d-flex">' +
                '<div class="toast-body"><i class="bi ' + icon + ' me-2"></i><span></span></div>' +
                '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>' +
                '</div>';

            toastEl.querySelector('.toast-body span').textContent = String(message || 'Done');
            container.appendChild(toastEl);

            var toast = new bootstrap.Toast(toastEl, { delay: autoHideDelay });
            toastEl.addEventListener('hidden.bs.toast', function () {
                toastEl.remove();
            });
            toast.show();
        };

        // Force a network re-check when returning via back/forward navigation.
        // This prevents stale pages from being restored from browser history cache.
        window.addEventListener('pageshow', function (event) {
            var nav = window.performance && window.performance.getEntriesByType
                ? window.performance.getEntriesByType('navigation')
                : [];
            var isHistoryNavigation = nav.length > 0 && nav[0].type === 'back_forward';

            if (event.persisted || isHistoryNavigation) {
                window.location.reload();
            }
        });
    </script>
    {% if current_user.is_authenticated %}
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <script>
        (function () {
            var endpoint = {{ (request.endpoint or '') | tojson }};
            var role = {{ (current_user.role or '') | tojson }};
            var userId = {{ current_user.id | tojson }};
            var shouldReload = false;

            var refreshableEndpoints = {
                'dashboard.index': true,
                'borrow.new_borrow': true,
                'borrow.new_return': true,
                'borrow.overdue_management': true,
                'borrow.notification_center': true,
                'equipment.list_equipment': true,
                'auth.member_dashboard': true
            };

            if (!refreshableEndpoints[endpoint]) {
                return;
            }

            var socket = io({
                transports: ['websocket', 'polling']
            });

            socket.on('connect_error', function () {
                // Keep app usable even when realtime transport is unavailable.
            });

            socket.on('app_data_changed', function (payload) {
                payload = payload || {};
                if (shouldReload) {
                    return;
                }

                if (role === 'member') {
                    var targetMemberId = payload.member_id;
                    if (targetMemberId !== null && targetMemberId !== undefined && Number(targetMemberId) !== Number(userId)) {
                        return;
                    }
                }

                shouldReload = true;
                window.showAppToast('New updates are available. Refreshing...', 'info', 1200);
                setTimeout(function () {
                    window.location.reload();
                }, 900);
            });
        })();
    </script>
    <script>
        (function () {
            var sidebar = document.getElementById('appSidebar');
            var backdrop = document.getElementById('sidebarBackdrop');

            function setSidebarOpen(open) {
                if (!sidebar || !backdrop) {
                    return;
                }
                sidebar.classList.toggle('open', open);
                backdrop.classList.toggle('show', open);
                document.body.classList.toggle('sidebar-open', open);
            }

            window.toggleSidebar = function () {
                if (!sidebar) {
                    return;
                }
                var isOpen = sidebar.classList.contains('open');
                setSidebarOpen(!isOpen);
            };

            window.closeSidebar = function () {
                setSidebarOpen(false);
            };

            if (sidebar) {
                sidebar.querySelectorAll('a.nav-link').forEach(function (link) {
                    link.addEventListener('click', function () {
                        if (window.innerWidth < 992) {
                            setSidebarOpen(false);
                        }
                    });
                });
            }

            function refreshCompactTopbarButtons() {
                var isCompact = window.innerWidth <= 575;
                var buttons = document.querySelectorAll('.topbar-right .btn');

                buttons.forEach(function (btn) {
                    var rawLabel = (btn.getAttribute('data-compact-label') || btn.textContent || '').replace(/\s+/g, ' ').trim();
                    if (!rawLabel) {
                        rawLabel = 'Action';
                    }
                    btn.setAttribute('data-compact-label', rawLabel);

                    if (isCompact) {
                        btn.setAttribute('aria-label', rawLabel);
                        btn.setAttribute('title', rawLabel);
                        if (window.bootstrap && !btn._compactTooltip) {
                            btn.setAttribute('data-bs-toggle', 'tooltip');
                            btn.setAttribute('data-bs-placement', 'bottom');
                            btn._compactTooltip = new bootstrap.Tooltip(btn);
                        }
                    } else {
                        if (btn._compactTooltip) {
                            btn._compactTooltip.dispose();
                            btn._compactTooltip = null;
                        }
                        btn.removeAttribute('data-bs-toggle');
                        btn.removeAttribute('data-bs-placement');
                        btn.removeAttribute('title');
                    }
                });
            }

            refreshCompactTopbarButtons();

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    setSidebarOpen(false);
                }
                refreshCompactTopbarButtons();
            });
        })();
    </script>
    {% endif %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
