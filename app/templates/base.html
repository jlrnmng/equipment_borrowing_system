<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QR Equipment Borrowing System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='ui-polish.css') }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Force a network re-check when returning via back/forward navigation.
        // This prevents stale pages from being restored from browser history cache.
        window.addEventListener('pageshow', function (event) {
            var nav = window.performance && window.performance.getEntriesByType
                ? window.performance.getEntriesByType('navigation')
                : [];
            var isHistoryNavigation = nav.length > 0 && nav[0].type === 'back_forward';

            if (event.persisted || isHistoryNavigation) {
                window.location.reload();
            }
        });
    </script>
    {% if current_user.is_authenticated %}
    <script>
        (function () {
            var sidebar = document.getElementById('appSidebar');
            var backdrop = document.getElementById('sidebarBackdrop');

            function setSidebarOpen(open) {
                if (!sidebar || !backdrop) {
                    return;
                }
                sidebar.classList.toggle('open', open);
                backdrop.classList.toggle('show', open);
                document.body.classList.toggle('sidebar-open', open);
            }

            window.toggleSidebar = function () {
                if (!sidebar) {
                    return;
                }
                var isOpen = sidebar.classList.contains('open');
                setSidebarOpen(!isOpen);
            };

            window.closeSidebar = function () {
                setSidebarOpen(false);
            };

            if (sidebar) {
                sidebar.querySelectorAll('a.nav-link').forEach(function (link) {
                    link.addEventListener('click', function () {
                        if (window.innerWidth < 992) {
                            setSidebarOpen(false);
                        }
                    });
                });
            }

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    setSidebarOpen(false);
                }
            });
        })();
    </script>
    {% endif %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
