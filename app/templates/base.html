<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QR Equipment Borrowing System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height:100vh; background:#1a2035; color:#c8ccd4; width:240px; position:fixed; top:0; left:0; display:flex; flex-direction:column; z-index:100; }
        .sidebar .brand { padding:1.25rem 1.5rem; border-bottom:1px solid rgba(255,255,255,.08); }
        .sidebar .brand h6 { color:#fff; font-weight:700; margin:0; font-size:.95rem; }
        .sidebar .brand small { color:#8b93a5; font-size:.7rem; }
        .sidebar .nav-link { color:#8b93a5; padding:.6rem 1.5rem; font-size:.875rem; border-radius:0; transition:background .15s,color .15s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color:#fff; background:rgba(255,255,255,.08); }
        .sidebar .nav-link i { width:20px; margin-right:.5rem; }
        .sidebar .nav-section { padding:.9rem 1.5rem .3rem; font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:#4e5a6e; }
        .sidebar-bottom { margin-top:auto; border-top:1px solid rgba(255,255,255,.08); padding:1rem 1.5rem; }
        .main-content { margin-left:240px; min-height:100vh; }
        .topbar { background:#fff; border-bottom:1px solid #e9ecef; padding:.75rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
        .page-content { padding:1.5rem; }
        .stat-card { border:none; border-radius:.5rem; box-shadow:0 1px 4px rgba(0,0,0,.08); }
        .stat-card .icon-box { width:48px; height:48px; border-radius:.4rem; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% if current_user.is_authenticated %}
    <script>
        // Force a network re-check when returning via back/forward navigation.
        // This prevents stale authenticated pages from appearing after logout.
        window.addEventListener('pageshow', function (event) {
            var nav = window.performance && window.performance.getEntriesByType
                ? window.performance.getEntriesByType('navigation')
                : [];
            var isHistoryNavigation = nav.length > 0 && nav[0].type === 'back_forward';

            if (event.persisted || isHistoryNavigation) {
                window.location.reload();
            }
        });
    </script>
    {% endif %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
